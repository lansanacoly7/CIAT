# Base PostgreSQL pour le développement en équipe.
#   docker compose up -d
# puis dans backend/.env :
#   DATABASE_URL=postgres://ciat:ciat@localhost:5432/ciat
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ciat
      POSTGRES_PASSWORD: ciat
      POSTGRES_DB: ciat
    ports:
      - "5432:5432"
    volumes:
      - ciat_pg:/var/lib/postgresql/data

volumes:
  ciat_pg:
