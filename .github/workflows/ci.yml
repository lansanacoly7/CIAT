name: CI Plateforme CIAT

on:
  push:
    branches:
      - "feature/*"
      - "dev-lansana-coly"
      - "test"
  pull_request:
    branches:
      - "dev-lansana-coly"
      - "test"

jobs:
  backend:
    name: Backend Django (Python 3.13)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Configurer Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Vérification du système (check)
        run: python manage.py check

      - name: Vérification des migrations manquantes
        run: python manage.py makemigrations --check --dry-run

      - name: Exécution des tests unitaires
        run: python manage.py test

  frontend:
    name: Frontend Next.js (Node 22)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Configurer Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Installer les dépendances
        run: npm ci

      - name: Analyse statique (lint)
        run: npm run lint

      - name: Compilation de production (build)
        run: npm run build
