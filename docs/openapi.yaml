components:
  schemas:
    Actualite:
      type: object
      description: 'Format : { id, titre, slug, resume, contenu, image, publie_le
        }'
      properties:
        id:
          type: integer
          readOnly: true
        titre:
          type: string
          maxLength: 200
        slug:
          type: string
          pattern: ^[-a-zA-Z0-9_]+$
        resume:
          type: string
        contenu:
          type: string
        image:
          type: string
          format: uri
          nullable: true
        publie:
          type: boolean
          description: Seules les actualités publiées sont visibles du public.
