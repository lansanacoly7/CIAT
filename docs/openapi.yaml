components:
  schemas:
    Actualite:
      type: object
      description: 'Format : { id, titre, slug, resume, contenu, image, publie_le
        }'
      properties:
        id:
          type: integer
          readOnly: true
        titre:
          type: string
          maxLength: 200
        slug:
          type: string
          pattern: ^[-a-zA-Z0-9_]+$
        resume:
          type: string
        contenu:
          type: string
        image:
          type: string
          format: uri
          nullable: true
        publie:
          type: boolean
          description: Seules les actualités publiées sont visibles du public.
        vues:
          type: integer
          readOnly: true
          description: Nombre de consultations de l'actualité.
        publie_le:
          type: string
          format: date-time
      required:
      - contenu
      - id
      - titre
      - vues
    AppelProjet:
      type: object
      description: 'Format : { id, titre, description, date_limite, statut: "ouvert"|"clos",
        pieces_demandees }'
      properties:
        id:
          type: integer
          readOnly: true
        titre:
          type: string
          maxLength: 200
        description:
          type: string
        date_limite:
          type: string
          format: date-time
        statut:
          type: string
          readOnly: true
        pieces_demandees: {}
      required:
      - date_limite
      - description
      - id
      - statut
      - titre
    BlankEnum:
      enum:
      - ''
    Cohorte:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        nom:
          type: string
          maxLength: 120
        annee:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        date_debut:
          type: string
          format: date
          nullable: true
        date_fin:
          type: string
          format: date
          nullable: true
      required:
      - annee
      - id
      - nom
    Conversation:
      type: object
      description: Sérialiseur d'une conversation (liste et création).
      properties:
        id:
          type: integer
          readOnly: true
        titre:
          type: string
          default: Nouvelle conversation
          maxLength: 200
        cree_le:
          type: string
          format: date-time
          readOnly: true
      required:
      - cree_le
      - id
    CreerMessageInput:
      type: object
      description: Données d'entrée pour poser une question à l'assistant.
      properties:
        contenu:
          type: string
          description: Question ou consigne posée à l'assistant
        mode:
          allOf:
          - $ref: '#/components/schemas/ModeEnum'
          default: documents
          description: |-
            Mode d'échange : 'documents' (recherche stricte) ou 'atelier' (rédaction)

            * `documents` - Recherche dans les documents
            * `atelier` - Atelier de rédaction
      required:
      - contenu
    DocumentPublic:
      type: object
      description: 'Format : { id, titre, categorie, fichier }'
      properties:
        id:
          type: integer
          readOnly: true
        titre:
          type: string
          maxLength: 200
        categorie:
          type: string
          description: 'Ex: Rapports, Charte, Guides, Formulaires'
          maxLength: 100
        fichier:
          type: string
          format: uri
      required:
      - categorie
      - fichier
      - id
      - titre
    Domaine:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        nom:
          type: string
          maxLength: 120
        slug:
          type: string
          readOnly: true
          pattern: ^[-a-zA-Z0-9_]+$
      required:
      - id
      - nom
      - slug
    Dossier:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        projet:
          allOf:
          - $ref: '#/components/schemas/ProjetSimple'
          readOnly: true
        projet_id:
          type: integer
          writeOnly: true
        statut:
          allOf:
          - $ref: '#/components/schemas/DossierStatutEnum'
          readOnly: true
        completude:
          type: integer
          readOnly: true
        pieces:
          type: array
          items:
            $ref: '#/components/schemas/Piece'
          readOnly: true
        pieces_manquantes:
          type: array
          items:
            type: string
          readOnly: true
        soumis_le:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        cree_le:
          type: string
          format: date-time
          readOnly: true
        modifie_le:
          type: string
          format: date-time
          readOnly: true
      required:
      - completude
      - cree_le
      - id
      - modifie_le
      - pieces
      - pieces_manquantes
      - projet
      - soumis_le
      - statut
    DossierStatutEnum:
      enum:
      - brouillon
      - soumis
      - complet
      - en_evaluation
      - accepte
      - refuse
      type: string
      description: |-
        * `brouillon` - Brouillon
        * `soumis` - Soumis
        * `complet` - Complet
        * `en_evaluation` - En évaluation
        * `accepte` - Accepté
        * `refuse` - Refusé
    Evenement:
      type: object
      description: 'Format : { id, titre, description, lieu, debut, fin, lien_inscription
        }'
      properties:
        id:
          type: integer
          readOnly: true
        titre:
          type: string
          maxLength: 200
        description:
          type: string
        lieu:
          type: string
          maxLength: 200
        debut:
          type: string
          format: date-time
        fin:
          type: string
          format: date-time
          nullable: true
        lien_inscription:
          type: string
          format: uri
          maxLength: 500
      required:
      - debut
      - description
      - id
      - lieu
      - titre
    FicheInnovation:
      type: object
      description: |-
        Sérialiseur de consultation d'une fiche d'innovation.

        Ne renvoie STRICTEMENT aucune donnée personnelle ou confidentielle
        (pas d'email, pas de téléphone du porteur).
      properties:
        id:
          type: integer
          readOnly: true
        slug:
          type: string
          readOnly: true
          pattern: ^[-a-zA-Z0-9_]+$
        projet:
          type: integer
          description: Identifiant du projet associé
        titre:
          type: string
          title: Titre de la fiche
          maxLength: 200
        probleme:
          type: string
          title: Problème adressé
        solution:
          type: string
          title: Solution innovante
        equipe:
          type: string
          title: Présentation de l'équipe
          description: Présentation de l'équipe (noms et compétences, sans données
            privées)
        avancement:
          type: string
          title: Niveau d'avancement
          description: 'Ex : Idée, Prototype, MVP, Pilote, Déploiement'
          maxLength: 100
        medias:
          type: array
          items:
            type: object
            additionalProperties: {}
        statut:
          allOf:
          - $ref: '#/components/schemas/Statut934Enum'
          readOnly: true
          title: Statut du workflow
        vues:
          type: integer
          readOnly: true
          title: Nombre de consultations
      required:
      - avancement
      - equipe
      - id
      - probleme
      - projet
      - slug
      - solution
      - statut
      - titre
      - vues
    FicheInnovationCreate:
      type: object
