        projet.
      properties:
        id:
          type: integer
          readOnly: true
        slug:
          type: string
          readOnly: true
          pattern: ^[-a-zA-Z0-9_]+$
        projet:
          type: integer
          description: Identifiant du projet associé
        titre:
          type: string
          title: Titre de la fiche
          maxLength: 200
        probleme:
          type: string
          title: Problème adressé
        solution:
          type: string
          title: Solution innovante
        equipe:
          type: string
          title: Présentation de l'équipe
