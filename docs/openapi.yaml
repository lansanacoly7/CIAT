openapi: 3.0.3
info:
  title: API Plateforme CIAT
  version: 0.1.0
  description: API unique de la plateforme du Centre d'Innovation, d'Application et
    de Transfert.
paths:
  /api/analytics/evolution/:
    get:
      operationId: analytics_evolution_retrieve
      description: |-
        GET /api/analytics/evolution/

        Évolution chronologique par mois de création (format 'YYYY-MM').
        Format : [{"mois": string, "total": number}]
      tags:
      - analytics
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/analytics/export/:
    get:
      operationId: analytics_export_retrieve
      description: |-
        GET /api/analytics/export/?format=xlsx|pdf

        Exporte le rapport complet d'analyse décisionnelle aux formats Excel (.xlsx) ou PDF (.pdf).
        Prend en compte l'ensemble des filtres actifs (?debut=&fin=&cohorte=&domaine=&statut=)
        et applique les mêmes règles d'accès que les autres endpoints du tableau de bord.
      tags:
      - analytics
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/analytics/financements/:
    get:
      operationId: analytics_financements_retrieve
      description: |-
        GET /api/analytics/financements/

        Liste des financements accordés et décaissés pour les projets du CIAT avec filtres.
        Accessible à l'équipe CIAT et au comité de sélection.
      tags:
      - analytics
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/analytics/indicateurs/:
    get:
      operationId: analytics_indicateurs_retrieve
      description: |-
        GET /api/analytics/indicateurs/

        Indicateurs clés du tableau de bord :
        - idees_recues : total des projets enregistrés
        - dossiers_deposes : dossiers déposés (ou projets passés par le dépôt si les dossiers formels ne sont pas encore créés)
        - projets_selectionnes : projets retenus/sélectionnés pour incubation
        - projets_incubes : projets entrés en incubation active
        - prototypes : prototypes réalisés
        - taux_selection : pourcentage calculé (arrondi à 1 décimale)
      tags:
      - analytics
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/analytics/indicateurs/definitions/:
    get:
      operationId: analytics_indicateurs_definitions_retrieve
      description: |-
        GET /api/analytics/indicateurs/definitions/

        Fournit le dictionnaire complet et standardisé de tous les indicateurs
        décisionnels affichés sur le tableau de bord CIAT (P3) :
        - code & nom
        - catégorie
        - définition exacte
        - formule de calcul mathématique et logique
        - période de référence et filtres supportés
        - source des données (modèles et tables SQL)
        - limites méthodologiques (ex: dossiers déposés vs idées reçues)
        - guide d'interprétation et seuils d'analyse
      tags:
      - analytics
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/analytics/par-cohorte/:
    get:
      operationId: analytics_par_cohorte_retrieve
      description: |-
        GET /api/analytics/par-cohorte/

        Comparaison entre cohortes annuelles :
        Format : [{"cohorte": string, "total": number, "selectionnes": number, "prototypes": number}]
      tags:
      - analytics
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/analytics/par-domaine/:
    get:
      operationId: analytics_par_domaine_retrieve
      description: |-
        GET /api/analytics/par-domaine/

        Répartition des projets par domaine d'intervention.
        Format : [{"domaine": string, "total": number}]
      tags:
      - analytics
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/analytics/par-genre/:
    get:
      operationId: analytics_par_genre_retrieve
      description: |-
        GET /api/analytics/par-genre/

        Répartition par genre des porteurs de projet (Femmes, Hommes, Autre).
        Format : [{"genre": string, "total": number}]
      tags:
      - analytics
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/analytics/partenariats/:
    get:
      operationId: analytics_partenariats_retrieve
      description: |-
        GET /api/analytics/partenariats/

        Liste des partenariats reliés aux projets du CIAT avec filtres (cohorte, domaine, statut, type, dates).
        Accessible à l'équipe CIAT et au comité de sélection.
      tags:
      - analytics
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/analytics/partenariats-financements/stats/:
    get:
      operationId: analytics_partenariats_financements_stats_retrieve
      description: |-
        GET /api/analytics/partenariats-financements/stats/

        Indicateurs agrégés pour le tableau de bord :
        - total_finance : montant total cumulé en FCFA
        - financements_decaisses : montant décaissé en FCFA
        - nombre_financements : nombre d'opérations de financement
        - nombre_partenariats_actifs : partenariats actifs
        - total_partenariats : volume total de partenariats
        - par_source : ventilation par guichet/source de financement
        - par_type_partenariat : ventilation par catégorie
      tags:
      - analytics
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/analytics/question/:
    post:
      operationId: analytics_question_create
      description: |-
        POST /api/analytics/question/

        Pose une question en langage naturel sur les données d'analyse décisionnelle.
        Format attendu : { "question": "Combien de projets en prototype dans la cohorte 2025 ?" }
        Format renvoyé : { "reponse": string, "donnees": any, "filtres_utilises": dict }

        Sécurité stricte :
        - Le modèle de langage ne génère JAMAIS de code SQL ni de scripts exécutables.
        - Il sélectionne uniquement parmi une liste fermée d'endpoints et de filtres autorisés.
        - L'accès est restreint aux mêmes rôles que les indicateurs (IsAnalyticsAuthorized).
        - Débit limité par le throttle 'ai' (20 requêtes / min).
      tags:
      - analytics
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/assistant/conversations/:
    get:
      operationId: assistant_conversations_list
      description: Gestion des conversations privées de l'utilisateur avec l'assistant
        IA.
      summary: Lister mes conversations avec l'assistant
      tags:
      - assistant
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Conversation'
          description: ''
    post:
      operationId: assistant_conversations_create
      description: Gestion des conversations privées de l'utilisateur avec l'assistant
        IA.
      summary: Créer une nouvelle conversation
      tags:
      - assistant
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Conversation'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Conversation'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Conversation'
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Conversation'
          description: ''
  /api/assistant/conversations/{id}/messages/:
    get:
      operationId: assistant_conversations_messages_list
      description: Lecture de l'historique et soumission d'une question à l'assistant
        IA.
      summary: Lister les messages d'une conversation
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - assistant
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MessageAssistant'
          description: ''
    post:
      operationId: assistant_conversations_messages_create
      description: Lecture de l'historique et soumission d'une question à l'assistant
        IA.
      summary: Envoyer un message et obtenir la réponse de l'assistant
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - assistant
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreerMessageInput'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CreerMessageInput'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CreerMessageInput'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageAssistant'
          description: ''
        '400':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '503':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/assistant/indexation/:
    post:
      operationId: assistant_indexation_create
      description: Endpoint administratif permettant de découper et indexer les documents
        publics.
      summary: Réindexer les documents publics du portail pour l'assistant
      tags:
      - assistant
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '403':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/auth/me/:
    get:
      operationId: auth_me_retrieve
      tags:
      - auth
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
    put:
      operationId: auth_me_update
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/User'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/User'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/User'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
    patch:
      operationId: auth_me_partial_update
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedUser'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedUser'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedUser'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
  /api/auth/register/:
    post:
      operationId: auth_register_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Register'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Register'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Register'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Register'
          description: ''
  /api/auth/token/:
    post:
      operationId: auth_token_create
      description: Obtention du JWT protégé par limitation de débit anti force-brute.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenObtainPair'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenObtainPair'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenObtainPair'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenObtainPair'
          description: ''
  /api/auth/token/refresh/:
    post:
      operationId: auth_token_refresh_create
      description: |-
        Takes a refresh type JSON web token and returns an access type JSON web
        token if the refresh token is valid.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
  /api/cohortes/:
    get:
      operationId: cohortes_list
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - cohortes
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Cohorte'
          description: ''
    post:
      operationId: cohortes_create
      tags:
      - cohortes
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Cohorte'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Cohorte'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Cohorte'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cohorte'
          description: ''
  /api/cohortes/{id}/:
    get:
      operationId: cohortes_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this cohorte.
        required: true
      tags:
      - cohortes
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cohorte'
          description: ''
    put:
      operationId: cohortes_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this cohorte.
        required: true
      tags:
      - cohortes
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Cohorte'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Cohorte'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Cohorte'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cohorte'
          description: ''
    patch:
      operationId: cohortes_partial_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this cohorte.
        required: true
      tags:
      - cohortes
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedCohorte'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedCohorte'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedCohorte'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cohorte'
          description: ''
    delete:
      operationId: cohortes_destroy
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this cohorte.
        required: true
      tags:
      - cohortes
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/documents/:
    get:
      operationId: documents_retrieve
      description: 'GET /api/documents/ : Liste mes documents (l''équipe CIAT voit
        tous les documents).'
      tags:
      - documents
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/documents/{id}/:
    get:
      operationId: documents_retrieve_2
      description: |-
        GET /api/documents/{id}/ : Détail avec sections de la version courante.

        PATCH /api/documents/{id}/ : Crée une nouvelle version avec les sections modifiées.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - documents
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
    patch:
      operationId: documents_partial_update
      description: |-
        GET /api/documents/{id}/ : Détail avec sections de la version courante.

        PATCH /api/documents/{id}/ : Crée une nouvelle version avec les sections modifiées.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - documents
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/documents/{id}/brouillon/:
    post:
      operationId: documents_brouillon_create
      description: |-
        POST /api/documents/{id}/brouillon/ : Coordonnateur ou Administrateur.

        Repasse un document au statut 'brouillon' pour permettre de nouvelles modifications.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - documents
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/documents/{id}/export/:
    get:
      operationId: documents_export_retrieve
      description: |-
        GET /api/documents/{id}/export/?format=docx ou ?format=pdf :

        Exporte le document au format Word ou PDF mis en forme selon la charte graphique CIAT.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - documents
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/documents/{id}/publier/:
    post:
      operationId: documents_publier_create
      description: |-
        POST /api/documents/{id}/publier/ : Administrateur uniquement.

        Passe un document de 'valide' à 'publie'.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - documents
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/documents/{id}/valider/:
    post:
      operationId: documents_valider_create
      description: |-
        POST /api/documents/{id}/valider/ : Coordonnateur ou Administrateur.

        Passe un document de 'brouillon' à 'valide'.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - documents
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/documents/{id}/versions/:
    get:
      operationId: documents_versions_retrieve
      description: 'GET /api/documents/{id}/versions/ : Historique des versions d''un
        document.'
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - documents
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/documents/{id}/versions/{numero}/:
    get:
      operationId: documents_versions_retrieve_2
      description: 'GET /api/documents/{id}/versions/{numero}/ : Détail d''une version
        spécifique.'
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      - in: path
        name: numero
        schema:
          type: integer
        required: true
      tags:
      - documents
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/documents/generer/:
    post:
      operationId: documents_generer_create
      description: Génération assistée par IA d'un document structuré conforme à la
        charte CIAT.
      tags:
      - documents
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/documents/modeles/:
    get:
      operationId: documents_modeles_retrieve
      description: Liste des modèles de documents, filtrable par type (?type=id_ou_code).
      tags:
      - documents
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/documents/types/:
    get:
      operationId: documents_types_retrieve
      description: Liste des types de documents disponibles (appel, convention, fiche,
        PV...).
      tags:
      - documents
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/domaines/:
    get:
      operationId: domaines_list
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - domaines
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Domaine'
          description: ''
    post:
      operationId: domaines_create
      tags:
      - domaines
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Domaine'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Domaine'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Domaine'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Domaine'
          description: ''
  /api/domaines/{id}/:
    get:
      operationId: domaines_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this domaine.
        required: true
      tags:
      - domaines
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Domaine'
          description: ''
    put:
      operationId: domaines_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this domaine.
        required: true
      tags:
      - domaines
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Domaine'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Domaine'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Domaine'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
