openapi: 3.0.3
info:
  title: API Plateforme CIAT
  version: 0.1.0
  description: API unique de la plateforme du Centre d'Innovation, d'Application et
    de Transfert.
paths:
  /api/analytics/evolution/:
    get:
      operationId: analytics_evolution_retrieve
      description: Restitue l'évolution mensuelle des dépôts de projets pour analyser
        la saisonnalité.
      tags:
      - analytics
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/analytics/export/:
    get:
      operationId: analytics_export_retrieve
      description: Génère et télécharge le rapport consolidé du tableau de bord au
        format Excel ou PDF institutionnel.
      tags:
      - analytics
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/analytics/financements/:
    get:
      operationId: analytics_financements_retrieve
      description: Liste les financements accordés et décaissés avec traçabilité des
        guichets d'origine.
      tags:
      - analytics
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/analytics/indicateurs/:
    get:
      operationId: analytics_indicateurs_retrieve
      description: |-
        Calcule les indicateurs globaux du pipeline en une seule requête SQL performante.

        Règles d'intégrité métier :
        - Recoupement : croise les projets déclarés avec les dossiers formels d'incubation.
        - Taux de sélection : calculé rigoureusement sur le ratio des projets retenus par rapport
          aux dossiers déposés éligibles.
      tags:
      - analytics
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/analytics/indicateurs/definitions/:
    get:
      operationId: analytics_indicateurs_definitions_retrieve
      description: |-
        GET /api/analytics/indicateurs/definitions/

        Fournit le dictionnaire complet et standardisé de tous les indicateurs
        décisionnels affichés sur le tableau de bord CIAT (P3) :
        - code & nom
        - catégorie
        - définition exacte
        - formule de calcul mathématique et logique
        - période de référence et filtres supportés
        - source des données (modèles et tables SQL)
        - limites méthodologiques (ex: dossiers déposés vs idées reçues)
        - guide d'interprétation et seuils d'analyse
      tags:
      - analytics
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/analytics/par-cohorte/:
    get:
      operationId: analytics_par_cohorte_retrieve
      description: Compare la performance et le passage à l'échelle (prototypes) entre
        promotions annuelles.
      tags:
      - analytics
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/analytics/par-domaine/:
    get:
      operationId: analytics_par_domaine_retrieve
      description: Agrège le volume de projets par filière technologique pour guider
        l'affectation des ressources.
      tags:
      - analytics
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/analytics/par-genre/:
    get:
      operationId: analytics_par_genre_retrieve
      description: Mesure la parité femmes/hommes des porteurs de projets selon les
        engagements institutionnels.
      tags:
      - analytics
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/analytics/partenariats/:
    get:
      operationId: analytics_partenariats_retrieve
      description: Liste les conventions et partenariats rattachés aux projets selon
        les filtres actifs.
      tags:
      - analytics
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/analytics/partenariats-financements/stats/:
    get:
      operationId: analytics_partenariats_financements_stats_retrieve
      description: Calcule les agrégats financiers globaux (montant mobilisé vs décaissé)
        et le taux de partenariats actifs.
      tags:
      - analytics
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/analytics/question/:
    post:
      operationId: analytics_question_create
      description: Traite une question décisionnelle en langage naturel avec limitation
        de débit et capture d'erreur 503.
      tags:
      - analytics
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/assistant/conversations/:
    get:
      operationId: assistant_conversations_list
      description: Gestion des conversations privées de l'utilisateur avec l'assistant
        IA.
      summary: Lister mes conversations avec l'assistant
      tags:
      - assistant
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Conversation'
          description: ''
    post:
      operationId: assistant_conversations_create
      description: Gestion des conversations privées de l'utilisateur avec l'assistant
        IA.
      summary: Créer une nouvelle conversation
      tags:
      - assistant
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Conversation'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Conversation'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Conversation'
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Conversation'
          description: ''
  /api/assistant/conversations/{id}/:
    get:
      operationId: assistant_conversations_retrieve
      description: Consultation et suppression d'une conversation privée avec l'assistant
        IA.
      summary: Détail d'une conversation
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - assistant
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Conversation'
          description: ''
        '403':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '404':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
    delete:
      operationId: assistant_conversations_destroy
      description: Consultation et suppression d'une conversation privée avec l'assistant
        IA.
      summary: Supprimer une conversation privée (Droit à l'effacement RGPD)
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - assistant
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
        '403':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '404':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/assistant/conversations/{id}/messages/:
    get:
      operationId: assistant_conversations_messages_list
      description: Lecture de l'historique et soumission d'une question à l'assistant
        IA.
      summary: Lister les messages d'une conversation
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - assistant
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MessageAssistant'
          description: ''
    post:
      operationId: assistant_conversations_messages_create
      description: Lecture de l'historique et soumission d'une question à l'assistant
        IA.
      summary: Envoyer un message et obtenir la réponse de l'assistant
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - assistant
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreerMessageInput'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CreerMessageInput'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CreerMessageInput'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageAssistant'
          description: ''
        '400':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '503':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/assistant/indexation/:
    post:
      operationId: assistant_indexation_create
      description: Endpoint administratif permettant de découper et indexer les documents
        publics.
      summary: Réindexer les documents publics du portail pour l'assistant
      tags:
      - assistant
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '403':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/audit/:
    get:
      operationId: audit_list
      description: Consultation en lecture seule du journal d'audit, filtrable par
        acteur, action et date.
      summary: Journal d'audit des actions sensibles
      parameters:
      - name: ordering
        required: false
        in: query
        description: Quel champ utiliser pour classer les résultats.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: Un numéro de page de l'ensemble des résultats.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: Un terme de recherche.
        schema:
          type: string
      tags:
      - audit
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedJournalAuditList'
          description: ''
        '403':
          description: Accès réservé à l'équipe CIAT
  /api/auth/me/:
    get:
      operationId: auth_me_retrieve
      summary: Consulter mon profil utilisateur
      tags:
      - auth
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
    put:
      operationId: auth_me_update
      summary: Modifier l'ensemble de mon profil
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/User'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/User'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/User'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
    patch:
      operationId: auth_me_partial_update
      summary: Modifier partiellement mon profil
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedUser'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedUser'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedUser'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
    delete:
      operationId: auth_me_destroy
      description: Exige le mot de passe actuel pour confirmation. Supprime les conversations
        privées de l'assistant et anonymise les données personnelles en conservant
        l'intégrité des projets.
      summary: Supprimer ou anonymiser mon compte (Droit à l'effacement RGPD)
      tags:
      - auth
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
        '400':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '401':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/auth/me/export/:
    get:
      operationId: auth_me_export_retrieve
      description: Télécharge un fichier JSON structuré reprenant profil, projets,
        dossiers, documents, conversations assistant et interactions.
      summary: Exporter l'ensemble de mes données personnelles en JSON (Portabilité
        RGPD)
      tags:
      - auth
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: string
                format: binary
                description: Fichier JSON exporté
          description: ''
  /api/auth/mot-de-passe/oublie/:
    post:
      operationId: auth_mot_de_passe_oublie_create
      description: Envoie un lien contenant un jeton sécurisé à usage unique expiré
        au bout de 1 heure. Pour des raisons strictes de sécurité (anti-énumération
        de comptes), cette route renvoie toujours un statut 200 avec le même message,
        que l'adresse email existe ou non.
      summary: Demande de réinitialisation de mot de passe (Public)
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MotDePasseOublie'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/MotDePasseOublie'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/MotDePasseOublie'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          description: Demande prise en compte (message générique systématique).
        '400':
          description: Format d'adresse email invalide.
  /api/auth/mot-de-passe/reinitialiser/:
    post:
      operationId: auth_mot_de_passe_reinitialiser_create
      description: 'Valide le jeton à usage unique (durée de validité : 1 heure),
        vérifie les contraintes de robustesse du nouveau mot de passe selon la politique
        de sécurité du CIAT, et invalide immédiatement le jeton pour prévenir toute
        réutilisation.'
      summary: Définition d'un nouveau mot de passe via jeton sécurisé (Public)
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MotDePasseReinitialiser'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/MotDePasseReinitialiser'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/MotDePasseReinitialiser'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          description: Mot de passe modifié avec succès.
        '400':
          description: Jeton expiré, déjà utilisé ou mot de passe non conforme.
  /api/auth/register/:
    post:
      operationId: auth_register_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Register'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Register'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Register'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Register'
          description: ''
  /api/auth/token/:
    post:
      operationId: auth_token_create
      description: Obtention du JWT protégé par limitation de débit anti force-brute.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenObtainPair'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenObtainPair'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenObtainPair'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenObtainPair'
          description: ''
  /api/auth/token/refresh/:
    post:
      operationId: auth_token_refresh_create
      description: |-
        Takes a refresh type JSON web token and returns an access type JSON web
        token if the refresh token is valid.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
  /api/cohortes/:
    get:
      operationId: cohortes_list
      parameters:
      - name: ordering
        required: false
        in: query
        description: Quel champ utiliser pour classer les résultats.
        schema:
          type: string
      - name: search
        required: false
        in: query
        description: Un terme de recherche.
        schema:
          type: string
      tags:
      - cohortes
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Cohorte'
          description: ''
    post:
      operationId: cohortes_create
      tags:
      - cohortes
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Cohorte'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Cohorte'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Cohorte'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cohorte'
          description: ''
  /api/cohortes/{id}/:
    get:
      operationId: cohortes_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Un(une) valeur entière unique identifiant ce(cette) Cohorte d'incubation.
        required: true
      tags:
      - cohortes
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cohorte'
          description: ''
    put:
      operationId: cohortes_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Un(une) valeur entière unique identifiant ce(cette) Cohorte d'incubation.
        required: true
      tags:
      - cohortes
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Cohorte'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Cohorte'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Cohorte'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cohorte'
          description: ''
    patch:
      operationId: cohortes_partial_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Un(une) valeur entière unique identifiant ce(cette) Cohorte d'incubation.
        required: true
      tags:
      - cohortes
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedCohorte'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedCohorte'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedCohorte'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cohorte'
          description: ''
    delete:
      operationId: cohortes_destroy
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Un(une) valeur entière unique identifiant ce(cette) Cohorte d'incubation.
        required: true
      tags:
      - cohortes
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/documents/:
    get:
      operationId: documents_retrieve
      description: 'GET /api/documents/ : Liste mes documents (l''équipe CIAT voit
        tous les documents).'
      tags:
      - documents
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/documents/{id}/:
    get:
      operationId: documents_retrieve_2
      description: |-
        GET /api/documents/{id}/ : Détail avec sections de la version courante.

        PATCH /api/documents/{id}/ : Crée une nouvelle version avec les sections modifiées.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - documents
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
    patch:
      operationId: documents_partial_update
      description: |-
        GET /api/documents/{id}/ : Détail avec sections de la version courante.

        PATCH /api/documents/{id}/ : Crée une nouvelle version avec les sections modifiées.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - documents
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/documents/{id}/brouillon/:
    post:
      operationId: documents_brouillon_create
      description: |-
        POST /api/documents/{id}/brouillon/ : Coordonnateur ou Administrateur.

        Repasse un document au statut 'brouillon' pour permettre de nouvelles modifications.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - documents
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/documents/{id}/export/:
    get:
      operationId: documents_export_retrieve
      description: |-
        GET /api/documents/{id}/export/?format=docx ou ?format=pdf :

        Exporte le document au format Word ou PDF mis en forme selon la charte graphique CIAT.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - documents
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/documents/{id}/publier/:
    post:
      operationId: documents_publier_create
      description: |-
        POST /api/documents/{id}/publier/ : Administrateur uniquement.

        Passe un document de 'valide' à 'publie'.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - documents
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/documents/{id}/valider/:
    post:
      operationId: documents_valider_create
      description: |-
        POST /api/documents/{id}/valider/ : Coordonnateur ou Administrateur.

        Passe un document de 'brouillon' à 'valide'.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - documents
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/documents/{id}/versions/:
    get:
      operationId: documents_versions_retrieve
